name: Bug report
description: Report a reproducible OHMC problem
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private robot logs, or restricted vendor assets.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest reproducible commands and public fixtures.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: OHMC revision
      placeholder: Git commit SHA
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Execution environment
      options:
        - Offline compiler
        - Simulation
        - Recorded vendor interface
        - Physical robot
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I removed credentials, personal data, private network details, and restricted assets.
          required: true

