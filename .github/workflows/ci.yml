name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev,mujoco]'
      - name: Test
        run: python -m pytest
      - name: Compile Python sources
        run: python -m compileall -q src
      - name: Validate Motion IR example
        run: ohmc validate-ir examples/minimal_motion.json
      - name: Import BVH example
        run: |
          ohmc inspect-source examples/simple_motion.bvh
          ohmc canonicalize-bvh examples/simple_motion.bvh --source-license CC0-1.0 --source-convention right_handed_x_right_y_up_z_backward --source-length-unit m --output build/canonical-motion.json
          ohmc normalize-canonical build/canonical-motion.json --rate-hz 100 --morphology-scale 0.9 --output build/canonical-motion-normalized.json
          ohmc canonicalize-bvh examples/full_body_motion.bvh --source-license CC0-1.0 --source-convention right_handed_x_forward_y_left_z_up --source-length-unit m --output build/full-body-canonical.json
          ohmc landmark-report build/full-body-canonical.json --output build/full-body-landmarks.json --require-full-source
          ohmc import-bvh examples/simple_motion.bvh --source-license CC0-1.0 --output build/simple_motion.json
          ohmc validate-ir build/simple_motion.json
          ohmc derive-kinematics build/simple_motion.json --output build/simple_motion_kinematics.json
          ohmc replay build/simple_motion.json --backend mujoco --model examples/simple_chain.xml --report build/replay-report.json
          ohmc inspect-robot profiles/unitree_g1_29dof.yaml
          ohmc inspect-robot profiles/agibot_x2_ultra_aimdk_v1.yaml
          ohmc map-joints build/simple_motion_kinematics.json --robot profiles/unitree_g1_29dof.yaml --mapping profiles/mappings/simple_bvh_semantics_v1.yaml --output build/unitree_g1_motion.json
          ohmc map-joints build/simple_motion_kinematics.json --robot profiles/agibot_x2_ultra_aimdk_v1.yaml --mapping profiles/mappings/simple_bvh_semantics_v1.yaml --output build/agibot_x2_motion.json
          ohmc validate-ir build/unitree_g1_motion.json
          ohmc validate-ir build/agibot_x2_motion.json
          ohmc quality-report build/unitree_g1_motion.json --robot profiles/unitree_g1_29dof.yaml --output build/unitree_g1_quality.json
          ohmc quality-report build/agibot_x2_motion.json --robot profiles/agibot_x2_ultra_aimdk_v1.yaml --output build/agibot_x2_quality.json
          ohmc encode-fixture build/unitree_g1_motion.json --robot profiles/unitree_g1_29dof.yaml --adapter unitree-g1-lowcmd --output build/unitree_g1_lowcmd_fixture.json
          ohmc encode-fixture build/agibot_x2_motion.json --robot profiles/agibot_x2_ultra_aimdk_v1.yaml --adapter agibot-x2-joint-command-array --output build/agibot_x2_joint_command_fixture.json
          ohmc simulate examples/simple_motion.bvh --target unitree-g1-contract-fixture --source-license CC0-1.0 --source-convention right_handed_x_right_y_up_z_backward --source-length-unit m --output build/one-click-smoke --cache-dir .ohmc-cache
          ohmc simulate examples/simple_motion.bvh --target unitree-g1-ik-contract-fixture --source-license CC0-1.0 --source-convention right_handed_x_right_y_up_z_backward --source-length-unit m --output build/one-click-ik-smoke --cache-dir .ohmc-cache
          ohmc verify-evidence build/one-click-smoke --report build/one-click-smoke-audit.json
          ohmc verify-evidence build/one-click-ik-smoke --report build/one-click-ik-smoke-audit.json
      - name: Validate vendor lock
        run: ohmc vendor --cache-dir .ohmc-cache status
