name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest
      - name: Compile Python sources
        run: python -m compileall -q src
      - name: Validate Motion IR example
        run: ohmc validate-ir examples/minimal_motion.json
      - name: Validate vendor lock
        run: ohmc vendor --cache-dir .ohmc-cache status
