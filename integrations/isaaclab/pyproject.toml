[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ohmc-x2-isaaclab"
version = "0.1.0.dev0"
description = "Pinned Isaac Lab/RSL-RL training extension for the OHMC X2 locomotion contract."
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = ["PyYAML>=6,<7"]

[tool.setuptools]
package-dir = { "" = "source" }

[tool.setuptools.packages.find]
where = ["source"]
